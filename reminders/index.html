<!doctype html><html><head><title>Follow-up Reminders | SHUDDHO</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><link rel="stylesheet" href="../platform-modules.css?v=5"><script>(function(){try{var t=localStorage.getItem("shuddhoCalcTheme");if(t)document.documentElement.dataset.theme=t}catch(e){}})()</script></head><body><header class="top"><div class="wrap row"><a class="brand" href="../">SHUDDHO Health Platform</a><nav class="nav"><a class="btn" href="../assessments/">Assess</a><a class="btn" href="../trackers/">Track</a><a class="btn" href="../labs/">Labs</a><a class="btn" href="../food-tools/">Food</a><a class="btn" href="../medication-nutrition/">Medicine</a><a class="btn" href="../dashboard/">Dashboard</a></nav></div></header><section class="hero"><div class="wrap"><span class="kicker">REVIEW LATER</span><h1>Follow-up Reminders</h1><p>Browser-এ follow-up date save করুন—weight review, repeat measurement, assessment check-in বা lab review-এর জন্য।</p></div></section><main class="wrap"><section class="card"><div class="field"><label>Reminder</label><input id="name" placeholder="Repeat waist measurement"></div><div class="field"><label>Date</label><input id="date" type="date"></div><button class="primary" id="add">Save reminder</button><div id="list"></div></section></main><script>
const k="shuddhoRemindersV5";function get(){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}function draw(){const a=get().sort((x,y)=>x.date.localeCompare(y.date));document.getElementById("list").innerHTML=a.map((x,i)=>`<div class="choice"><strong>${x.name}</strong> — ${x.date} <button class="btn" onclick="del(${i})">Done/remove</button></div>`).join("")||"<p class='muted'>No reminders.</p>"}document.getElementById("add").onclick=()=>{const a=get();a.push({name:document.getElementById("name").value,date:document.getElementById("date").value});localStorage.setItem(k,JSON.stringify(a));draw()};window.del=i=>{const a=get();a.splice(i,1);localStorage.setItem(k,JSON.stringify(a));draw()};draw();</script><script src="../sync/bootstrap.js?v=5.2"></script></body></html>
