name: Build Calculator SEO Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/calculators.json"
      - "calculator-engine.js"
      - "interpretation-engine.js"
      - "calculator-ui.js"
      - "calculator-page.css"
      - "scripts/generate-seo.js"
      - "assessments/**"
      - "trackers/**"
      - "labs/**"
      - "food-tools/**"
      - "medication-nutrition/**"
      - "dashboard/**"
      - "profile/**"
      - "privacy/**"
      - "onboarding/**"
      - "personalization/**"
      - "local-data.js"
      - "account/**"
      - "unified-health/**"
      - "sync/**"
      - "firebase/**"
      - "platform-modules.css"
      - ".github/workflows/build-seo-pages.yml"

permissions:
  contents: write

concurrency:
  group: calculator-seo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate bilingual calculator SEO pages
        env:
          BASE_URL: "https://probalsarpv-byte.github.io/SHUDDHO-Health-Calculators"
        run: node scripts/generate-seo.js

      - name: Validate generated files
        run: |
          test -f calculator/bmi/index.html
          test -f calculator/tdee/index.html
          test -f sitemap.xml
          test -f robots.txt
          test -f calculator-manifest.json
          test -f assessments/index.html
          test -f trackers/index.html
          test -f labs/index.html
          test -f food-tools/index.html
          test -f medication-nutrition/index.html
          test -f profile/index.html
          test -f privacy/index.html
          test -f account/index.html
          test -f unified-health/index.html
          test -f unified-health/unified-health.js
          test -f sync/bootstrap.js
          test -f sync/sync-engine.js
          test -f firebase/firebase-config.js
          test -f firebase/firestore.rules
          test -f navigation.js
          grep -q "interpretation-engine.js" calculator/bmi/index.html
          COUNT=$(find calculator -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "Generated calculator folders: $COUNT"
          test "$COUNT" -ge 65

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculator sitemap.xml robots.txt .nojekyll calculator-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate premium calculator pages with interpretation"
          git push
