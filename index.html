<script>
(function(){
  try{
    var t=localStorage.getItem("shuddhoCalcTheme");
    if(t) document.documentElement.dataset.theme=t;
  }catch(e){}
})();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" defer></script>
<script src="./app.js?v=5.4" defer></script>
<script src="./sync/bootstrap.js?v=5.4" defer></script>
  <script>
function sendHeightToBlogger() {
  const height = document.documentElement.scrollHeight || document.body.scrollHeight;
  window.parent.postMessage({ shuddhoFrameHeight: height }, '*');
}

// পেজ লোড হলে এবং উইন্ডো রিসাইজ হলে হাইট ব্লগারের কাছে পাঠানো
window.addEventListener('load', sendHeightToBlogger);
window.addEventListener('resize', sendHeightToBlogger);

// যদি ক্যালকুলেটর ট্যাব বদলানো হয় তবে হাইট আপডেট করা
const observer = new ResizeObserver(sendHeightToBlogger);
observer.observe(document.body);
</script>
</body>
</html>
