<!doctype html><html><head><title>Symptom & Lifestyle Checker | SHUDDHO</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><link rel="stylesheet" href="../platform-modules.css?v=5"><script>(function(){try{var t=localStorage.getItem("shuddhoCalcTheme");if(t)document.documentElement.dataset.theme=t}catch(e){}})()</script></head><body><header class="top"><div class="wrap row"><a class="brand" href="../">SHUDDHO Health Platform</a><nav class="nav"><a class="btn" href="../assessments/">Assess</a><a class="btn" href="../trackers/">Track</a><a class="btn" href="../labs/">Labs</a><a class="btn" href="../food-tools/">Food</a><a class="btn" href="../medication-nutrition/">Medicine</a><a class="btn" href="../dashboard/">Dashboard</a></nav></div></header><section class="hero"><div class="wrap"><span class="kicker">PATTERN CHECK — NOT DIAGNOSIS</span><h1>Symptom & Lifestyle Checker</h1><p>Fatigue, constipation, bloating, poor sleep, low appetite বা general lifestyle patterns থেকে কোন health domain review করা দরকার তা দেখুন।</p></div></section><main class="wrap"><section class="card"><h2>Select what applies</h2><div id="checks"></div><button class="primary" id="go">Show relevant domains</button><div id="out"></div></section></main><script>
const items=[["fatigue","Fatigue / low energy","sleep,nutrition,labs"],["constipation","Constipation","gut,fiber,hydration"],["bloating","Bloating","gut,food"],["sleep","Poor sleep","sleep,recovery"],["appetite","Low appetite","nutrition,weight"],["thirst","Frequent thirst","hydration,glucose"],["weightloss","Unintentional weight loss","nutrition,muscle,clinical"]];document.getElementById("checks").innerHTML=items.map(x=>`<label class="choice"><input type="checkbox" value="${x[2]}"> ${x[1]}</label>`).join("");document.getElementById("go").onclick=()=>{const a=[...document.querySelectorAll("input:checked")].flatMap(x=>x.value.split(","));const u=[...new Set(a)];document.getElementById("out").innerHTML=`<div class="result"><h3>Domains to review</h3><div class="chips">${u.map(x=>`<span class="chip">${x}</span>`).join("")||"No selections"}</div><p>This checker does not identify a disease. Persistent, severe or alarming symptoms need clinical evaluation.</p></div>`};</script><script src="../sync/bootstrap.js?v=5.2"></script><script src="../navigation.js?v=5.3"></script></body></html>
