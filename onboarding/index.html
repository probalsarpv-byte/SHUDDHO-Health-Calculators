<section class="hero"><div class="wrap"><span class="kicker">WELCOME</span><h1>Set up your local health experience</h1><p>৩টি ধাপে app personalize করুন। সব data এই browser/device-এ থাকবে।</p></div></section>
<main class="wrap"><section class="card"><form id="f">

<script src="../local-data.js?v=5.1"></script><script>document.getElementById("f").onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target)),old=SHUDDHO_LOCAL.get(SHUDDHO_LOCAL.KEYS.profile,{})||{};SHUDDHO_LOCAL.set(SHUDDHO_LOCAL.KEYS.profile,{...old,...o});localStorage.setItem("shuddhoCalcLang",o.language);SHUDDHO_LOCAL.set(SHUDDHO_LOCAL.KEYS.prefs,{onboarding_complete:true,created_at:new Date().toISOString()});document.getElementById("out").innerHTML='<div class="result"><h3>Setup complete</h3><a href="../dashboard/">Open your dashboard →</a></div>'};</script><script src="../sync/bootstrap.js?v=5.2"></script><script src="../navigation.js?v=5.3"></script></body></html>
