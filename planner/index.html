<!doctype html><html><head><title>Goal Planner | SHUDDHO</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><link rel="stylesheet" href="../platform-modules.css?v=5"><script>(function(){try{var t=localStorage.getItem("shuddhoCalcTheme");if(t)document.documentElement.dataset.theme=t}catch(e){}})()</script></head><body><header class="top"><div class="wrap row"><a class="brand" href="../">SHUDDHO Health Platform</a><nav class="nav"><a class="btn" href="../assessments/">Assess</a><a class="btn" href="../trackers/">Track</a><a class="btn" href="../labs/">Labs</a><a class="btn" href="../food-tools/">Food</a><a class="btn" href="../medication-nutrition/">Medicine</a><a class="btn" href="../dashboard/">Dashboard</a></nav></div></header>
<section class="hero"><div class="wrap"><span class="kicker">PLAN → DO → REVIEW</span><h1>Goal Planner</h1><p>আপনার health goal অনুযায়ী simple weekly action plan বানান।</p></div></section><main class="wrap"><section class="card"><div class="field"><label>Goal</label><select id="goal"><option>Weight management</option><option>Metabolic health</option><option>Muscle & strength</option><option>Healthy ageing</option><option>General wellness</option></select></div><button class="primary" id="make">Create plan</button><div id="out" style="margin-top:16px"></div></section></main><script>const plans={"Weight management":["Track weight and waist once weekly","Plan protein at each main meal","Aim for high-fiber foods daily","Build a sustainable calorie deficit","Review sleep and activity"],"Metabolic health":["Track waist and BP","Use HbA1c/glucose tools if labs are available","Aim for 3–5 active days/week","Prioritize fiber and minimally processed foods","Review sleep consistency"],"Muscle & strength":["Set a protein target","Distribute protein across meals","Strength train 2–4 days/week","Track body weight and performance","Protect sleep/recovery"],"Healthy ageing":["Review protein/kg","Strength train at least 2 days/week","Track unintended weight change","Maintain plant diversity and hydration","Review fall/mobility concerns"],"General wellness":["Complete General Health Assessment","Track one meaningful metric","Aim for regular activity","Improve sleep consistency","Build food variety"]};document.getElementById("make").onclick=()=>{const g=document.getElementById("goal").value;document.getElementById("out").innerHTML=`<div class="result"><h2>${g}</h2><ol>${plans[g].map(x=>`<li>${x}</li>`).join("")}</ol><p><a href="../trackers/">Start tracking →</a></p></div>`};</script><script src="../sync/bootstrap.js?v=5.2"></script></body></html>
