<!doctype html><html><head><title>Health Report Generator | SHUDDHO</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><link rel="stylesheet" href="../platform-modules.css?v=5"><script>(function(){try{var t=localStorage.getItem("shuddhoCalcTheme");if(t)document.documentElement.dataset.theme=t}catch(e){}})()</script><style>@media print{.top,.hero,.btn,#print{display:none!important}body{background:white!important;color:black!important}.card{border:1px solid #ddd!important;background:white!important;box-shadow:none!important}}</style></head><body><header class="top"><div class="wrap row"><a class="brand" href="../">SHUDDHO Health Platform</a><nav class="nav"><a class="btn" href="../assessments/">Assess</a><a class="btn" href="../trackers/">Track</a><a class="btn" href="../labs/">Labs</a><a class="btn" href="../food-tools/">Food</a><a class="btn" href="../medication-nutrition/">Medicine</a><a class="btn" href="../dashboard/">Dashboard</a></nav></div></header><section class="hero"><div class="wrap"><span class="kicker">LOCAL REPORT</span><h1>Health Report Generator</h1><p>Saved assessments, profile এবং tracker snapshot থেকে printable health summary তৈরি করুন।</p></div></section><main class="wrap"><button class="primary" id="print">Print / Save as PDF</button><section class="card" id="report"></section></main><script>
let A={},T={},P={},U=null;try{A=JSON.parse(localStorage.getItem("shuddhoAssessmentsV5")||"{}");T=JSON.parse(localStorage.getItem("shuddhoTrackerV5")||"{}");P=JSON.parse(localStorage.getItem("shuddhoProfileV5")||"{}");U=JSON.parse(localStorage.getItem("shuddhoUnifiedHealthV54")||"null")}catch(e){}const latest=Object.entries(T).map(([k,v])=>[k,v.slice().sort((a,b)=>a.date.localeCompare(b.date)).at(-1)]).filter(x=>x[1]);document.getElementById("report").innerHTML=`<h1>SHUDDHO Health Summary</h1><p>Generated: ${new Date().toLocaleString()}</p><h2>Profile</h2><p>${Object.entries(P).map(([k,v])=>`${k}: ${v}`).join(" · ")||"No profile saved."}</p><h2>Unified Health Profile</h2>${U?`<div class="choice"><strong>Overall context score:</strong> ${Math.round(U.overall)}/100 · Confidence ${U.confidence} · Coverage ${U.coveragePct}%</div>`:"<p>No unified health profile saved.</p>"}<h2>Assessments</h2>${Object.values(A).map(x=>`<div class="choice"><strong>${x.name}</strong>: ${x.score}/100 — ${x.status}</div>`).join("")||"<p>No assessments saved.</p>"}<h2>Latest tracker values</h2>${latest.map(([k,x])=>`<div class="choice"><strong>${k}</strong>: ${x.value} (${x.date})</div>`).join("")||"<p>No tracker values saved.</p>"}<div class="notice">This report is educational and does not constitute a diagnosis or medical record.</div>`;document.getElementById("print").onclick=()=>print();</script><script src="../sync/bootstrap.js?v=5.4"></script><script src="../navigation.js?v=5.4"></script></body></html>
